# Role registry (AI_PIPELINE.md §2-§3; loading and validation: BACKEND_DESIGN.md §5.5).
# Code references roles only, never model IDs. Changing this file is a major change
# (AI_PIPELINE.md §12) and passes the frozen-dataset scorecard.
#
# Model IDs come from Google's pages on 2026-10-02. "verified: false" until the slice 0.4 live
# smoke test (backend/tests/live/test_gemini_smoke.py) has confirmed every ID with an API key;
# that run also resolves Q8 (gemini-embedding-2 with or without -preview).
# max_output_tokens are initial caps (about 3-4x the expected output incl. thinking in
# AI_COST_MODEL.md §3), to be tuned on the frozen dataset.
