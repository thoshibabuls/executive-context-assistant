name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: ruff lint
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy
      - name: import boundaries
        run: lint-imports
      - name: gate A0 (evaluation data hashes, splits, contamination)
        run: python -m eca_evals gate-a0

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CI: "true"
      ECA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: install ffmpeg (media pipeline tests, TECHNICAL_DESIGN.md 16.1)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: tests (unit, api, integration, reliability)
        run: pytest

  image:
    # The deployment image (TECHNICAL_DESIGN.md 5, 16.1): builds, has ffmpeg and ffprobe, and every
    # entry point imports. No registry push: where it runs is decided with Q1.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: docker build -t eca:ci .
      - name: smoke
        run: |
          docker run --rm eca:ci ffmpeg -hide_banner -version
          docker run --rm eca:ci ffprobe -hide_banner -version
          docker run --rm eca:ci ffmpeg -hide_banner -encoders | grep -q libopus
          docker run --rm eca:ci python -c "import eca.api.app, eca.worker.composition; print('entry points import')"
          docker run --rm eca:ci alembic heads
          docker run --rm eca:ci sh -c 'test ! -e /app/backend/tests && test ! -e /app/.env && id -u'

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          # Keep the release asset name: the checksum file lists files by that name.
          ASSET="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL -o "${ASSET}" "${BASE}/${ASSET}"
          curl -fsSL -o checksums.txt "${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${ASSET}\$" checksums.txt | sha256sum -c -
          tar -xzf "${ASSET}" gitleaks
      - name: scan history
        run: ./gitleaks git --config .gitleaks.toml --redact --exit-code 1 .
