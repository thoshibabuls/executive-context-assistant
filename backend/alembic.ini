[alembic]
script_location = %(here)s/migrations
# Sequential revision IDs (0001, 0002, ...); one concern per migration (BACKEND_DESIGN.md §17.4).
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
# The database URL is never stored here; env.py reads API_MIGRATION_DATABASE_URL.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
