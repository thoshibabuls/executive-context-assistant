# Local development services (TECHNICAL_DESIGN.md §5.3, IMPLEMENTATION_PLAN.md slice 0.2).
# The API and worker run on the host; only PostgreSQL with pgvector runs in Docker.
# Dev-only credentials below are not secrets and must never be reused outside local development.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eca
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eca"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
